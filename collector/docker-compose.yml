# TimescaleDB + Modbus collector.
# The simulator runs on the host at 127.0.0.1:1502; from a container the host
# is reached via host.docker.internal (Docker Desktop; on Linux the
# extra_hosts entry maps it to the host gateway).
name: modbus-collector

services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: machine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d machine"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODBUS_ADDR: ${MODBUS_ADDR:-host.docker.internal:1502}
      UNIT_IDS: ${UNIT_IDS:-1,2,3}
      POLL_INTERVAL: ${POLL_INTERVAL:-1s}
      MODBUS_TIMEOUT: 2s
      DATABASE_URL: postgres://collector:collector@db:5432/machine?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # React dashboard + JSON API (polls the DB; see ../dashboard/README.md)
  dashboard:
    build: ../dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://collector:collector@db:5432/machine?sslmode=disable
      POLL_INTERVAL: ${DASHBOARD_POLL_INTERVAL:-1s}

volumes:
  dbdata:
